# Production stack: PostgreSQL + website + Caddy (automatic HTTPS).
#
#   cp .env.example .env    # then fill in the values
#   ./deploy/deploy.sh      # build, start, and refresh caches
#
# See DEPLOY.md for the full guide.

name: mendez

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mendez}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mendez}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mendez} -d ${POSTGRES_DB:-mendez}']
      interval: 5s
      timeout: 5s
      retries: 20
    # not published to the internet; reachable only from the other containers
    shm_size: 128mb

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?set NEXT_PUBLIC_SERVER_URL in .env}
    image: mendez-web:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mendez}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mendez}
      MEDIA_DIR: /app/media
    volumes:
      - media:/app/media
    expose:
      - '3000'
    mem_limit: 1g

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # One-off helpers:  docker compose --profile tools run --rm seed
  seed:
    profiles: ['tools']
    build:
      context: .
      target: tools
    image: mendez-tools:latest
    depends_on:
      db:
        condition: service_healthy
    env_file: ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-mendez}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mendez}
      MEDIA_DIR: /app/media
      REVALIDATE_URL: http://app:3000/next/revalidate
    volumes:
      - media:/app/media
    # runs as root, then hands the uploaded files to the app user (uid 1001)
    command: ['sh', '-c', 'pnpm payload migrate && pnpm seed && chown -R 1001:1001 /app/media']

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
